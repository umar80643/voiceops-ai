[project]
name = "voiceops-ai"
version = "0.1.0"
description = "Multimodal Speech Intelligence & Autonomous Customer Support Agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.20.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "locust>=2.31.0",
]
ml = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "scikit-learn>=1.5.0",
    "evaluate>=0.4.3",
    "mlflow>=2.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "shared*", "ml*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "shared", "ml", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
