name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy apps shared ml

      - name: Test (pytest)
        run: pytest -v --cov=apps --cov=shared --cov-report=term-missing

  infra-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/docker/api.Dockerfile

      - name: Lint Terraform (tflint)
        uses: terraform-linters/setup-tflint@v4
      - run: cd infra/terraform && tflint --init && tflint

      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -verbose infra/kubernetes/*.yaml
